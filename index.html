<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <video id="video_" class="background-video" autoplay loop muted playsinline>
        <source id="source_" src="./weathervids/clearsky.mp4" type="video/mp4">
    </video>

    <div class="main_container content">

        <!--Today's Date-->
        <div class="container temp_container">
            <p class="date"></p>
        </div>

        <!--Large Current Weather Card-->
        <div id="test-div">
            <div class="weather_container">
                <div class="container">
                    <div class="weather_card card" id="card-one">
                        <form class="search" id="search-form">
                            <input type="text" class="search-bar" id="search-bar" placeholder="Search a city" autocomplete="off">
                            <button type="submit" id="search-btn" aria-label="Search"><svg stroke="currentColor" fill="currentColor"
                                    stroke-width="0" viewBox="0 0 1024 1024" height="1.5em" width="1.5em"
                                    xmlns="http://www.w3.org/2000/svg">
                                    <path
                                        d="M909.6 854.5L649.9 594.8C690.2 542.7 712 479 712 412c0-80.2-31.3-155.4-87.9-212.1-56.6-56.7-132-87.9-212.1-87.9s-155.5 31.3-212.1 87.9C143.2 256.5 112 331.8 112 412c0 80.1 31.3 155.5 87.9 212.1C256.5 680.8 331.8 712 412 712c67 0 130.6-21.8 182.7-62l259.7 259.6a8.2 8.2 0 0 0 11.6 0l43.6-43.5a8.2 8.2 0 0 0 0-11.6zM570.4 570.4C528 612.7 471.8 636 412 636s-116-23.3-158.4-65.6C211.3 528 188 471.8 188 412s23.3-116.1 65.6-158.4C296 211.3 352.2 188 412 188s116.1 23.2 158.4 65.6S636 352.2 636 412s-23.3 116.1-65.6 158.4z">
                                    </path>
                                </svg></button>
                        </form>
                        <p class="error" id="error" hidden></p>

                        <div class="weather_dashboard" id="weather_dashboard">
                            <h2 class="city">Search for a city to see the weather</h2>
                        </div>
                    </div>
                </div>
            </div>

            <!--Smaller Current Weather Elements-->
            <div class="container sun_loading">
                <div class="box_container">
                    <div class="card box_card" id="card-two">
                        <div id="sunrise" class="sunrise">Sunrise: --</div>
                        <br />
                        <div id="sunset" class="sunset">Sunset: --</div>
                    </div>
                    <div class="card box_card" id="card-three">
                        <div class="element" id="vis">Visibility: --</div>
                    </div>
                </div>
                <div class="box_container">
                    <div class="card box_card" id="card-four">
                        <div class="element" id="tz">Time Zone: --</div>
                    </div>
                    <div class="card box_card" id="card-five">
                        <div class="element" id="wind">
                            <div class="data" id="wind-speed">Wind Speed: --</div>
                            <br>
                            <div class="data" id="wind-direction">Wind Direction: --</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!--5-Day Forecast-->
        <div class="forecast_container">
            <div class="card forecast_card" id="card-six">
                <div class="element week" id="week"></div>
            </div>
        </div>
    </div>

    <script src="scripts.js"></script>
</body>

</html>
